name: MLflow CI

on:
  push:
    branches:
      - main
      - feat/mlflow-ci
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "mlflow/**"
      - ".github/workflows/mlflow-ci.yml"
  workflow_dispatch:
    inputs:
      run_lint:
        description: "Run lint and type check"
        required: false
        type: boolean
        default: true
      run_health_check:
        description: "Run service health check"
        required: false
        type: boolean
        default: true
      run_integration_test:
        description: "Run Kubernetes integration test"
        required: false
        type: boolean
        default: true
      python_version:
        description: "Python version to use"
        required: false
        type: choice
        options:
          - "3.9"
          - "3.10"
          - "3.11"
        default: "3.9"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mlflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.run_lint == true || github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Using Python 3.9 (latest patch version) instead of 3.9.7 because 3.9.7 is not available for Ubuntu 24.04
          # The project requires Python 3.9.7+ (see mlflow/README.md), so any 3.9.x version satisfies this requirement
          python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.9' }}
          cache: "pip"
          cache-dependency-path: "mlflow/app_layer/requirements*.txt"

      - name: Install dependencies
        working-directory: mlflow/app_layer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Run pylint on app_layer
        working-directory: mlflow/app_layer
        run: |
          echo "Running pylint on entire app_layer directory..."
          pylint src/ --rcfile=pyproject.toml

      - name: Run mypy on app_layer
        working-directory: mlflow/app_layer
        run: |
          echo "Running mypy on entire app_layer directory..."
          mypy src/ --config-file=pyproject.toml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.9' }}
          cache: "pip"
          cache-dependency-path: "mlflow/app_layer/requirements*.txt"

      - name: Install dependencies
        working-directory: mlflow/app_layer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install -e .

      - name: Run unit tests
        working-directory: mlflow/app_layer
        run: |
          echo "Running unit tests..."
          pytest tests/ -v

  mlflow-integration-test:
    name: MLflow Integration Test with Kubernetes
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    env:
      KUBECONFIG: ${{ github.workspace }}/kind/config/kindkubeconfig.yaml
    steps:
      - name: Cleanup workspace before checkout
        run: |
          WORKSPACE_DIR="${{ github.workspace }}"
          if [ -d "$WORKSPACE_DIR" ]; then
            echo "Cleaning up workspace directory: $WORKSPACE_DIR"
            if [ -d "$WORKSPACE_DIR/kind" ]; then
              echo "Cleaning up kind directory..."
              sudo chmod -R u+w "$WORKSPACE_DIR/kind" 2>/dev/null || true
              sudo rm -rf "$WORKSPACE_DIR/kind/shared-storage" 2>/dev/null || true
              find "$WORKSPACE_DIR/kind" -type d -name "shared-storage" -exec sudo rm -rf {} + 2>/dev/null || true
            fi
          fi
          echo "✅ Cleanup completed"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          # Check if yq is already installed
          if command -v yq &> /dev/null; then
            echo "yq is already installed"
            yq --version
          else
            echo "Installing yq..."
            ARCH=$(uname -m)
            case $ARCH in
              x86_64)
                YQ_ARCH="amd64"
                ;;
              aarch64|arm64)
                YQ_ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture: $ARCH"
                exit 1
                ;;
            esac
            
            sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}"
            sudo chmod +x /usr/local/bin/yq
            yq --version
          fi

      - name: Cache Darwin dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mlflow-integration-${{ hashFiles('mlflow/app_layer/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-mlflow-integration-

      - name: Initialize Darwin configuration for MLflow only
        run: |
          # Enable all services first to generate the full config
          bash ./init.sh --all

          # Modify configuration to enable only MLflow services
          echo "Configuring MLflow-only deployment..."

          # Strategy: Disable ALL applications first, then enable only MLflow
          # This is robust against new services being added

          # Get all application keys and set them to false
          yq eval '.applications | keys | .[]' .setup/enabled-services.yaml | while read -r app; do
            yq eval ".applications.\"$app\" = false" -i .setup/enabled-services.yaml
          done

          # Enable only MLflow applications
          yq eval '.applications.darwin-mlflow = true' -i .setup/enabled-services.yaml
          yq eval '.applications.darwin-mlflow-app = true' -i .setup/enabled-services.yaml

          # Get all datastore keys and set them to false
          yq eval '.datastores | keys | .[]' .setup/enabled-services.yaml | while read -r ds; do
            yq eval ".datastores.\"$ds\" = false" -i .setup/enabled-services.yaml
          done

          # Enable only required datastores for MLflow
          yq eval '.datastores.mysql = true' -i .setup/enabled-services.yaml
          yq eval '.datastores.localstack = true' -i .setup/enabled-services.yaml
          yq eval '.datastores.busybox = true' -i .setup/enabled-services.yaml

          # Disable all ray images
          yq eval '.ray-images | to_entries | .[] | .key' .setup/enabled-services.yaml 2>/dev/null | while read -r image; do
            yq eval ".ray-images.\"$image\" = false" -i .setup/enabled-services.yaml
          done || true

          # Disable all serve images
          yq eval '.serve-images | to_entries | .[] | .key' .setup/enabled-services.yaml 2>/dev/null | while read -r image; do
            yq eval ".serve-images.\"$image\" = false" -i .setup/enabled-services.yaml
          done || true

          # Disable darwin-sdk-runtime if it exists
          yq eval '.darwin-sdk-runtime.enabled = false' -i .setup/enabled-services.yaml 2>/dev/null || true

          # Disable all CLI tools
          yq eval '.cli-tools | keys | .[]' .setup/enabled-services.yaml 2>/dev/null | while read -r tool; do
            yq eval ".cli-tools.\"$tool\" = false" -i .setup/enabled-services.yaml
          done || true

          echo "MLflow-only configuration complete"
          echo "Enabled services:"
          cat .setup/enabled-services.yaml

      - name: Setup Darwin platform
        run: |
          bash ./setup.sh -y

      - name: Deploy Darwin platform
        run: |
          # Export KUBECONFIG to GitHub environment for subsequent steps
          export KUBECONFIG="${{ github.workspace }}/kind/config/kindkubeconfig.yaml"
          echo "KUBECONFIG=${KUBECONFIG}" >> $GITHUB_ENV

          bash ./start.sh
          echo "Listing all pods in all namespaces:"
          kubectl get pods --all-namespaces

      - name: Wait for MLflow services to be ready
        run: |
          set -o allexport
          . ./config.env
          set +o allexport

          echo "Listing all pods in all namespaces:"
          kubectl get pods --all-namespaces

          echo "Waiting for MLflow services to be ready..."

          # Wait for darwin-mlflow (MLflow backend)
          echo "Checking darwin-mlflow (MLflow backend)..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=mlflow-lib -n darwin --timeout=300s || {
            echo "ERROR: darwin-mlflow pods failed to become ready"
            kubectl get pods -n darwin -l app.kubernetes.io/component=mlflow-lib
            kubectl describe pods -n darwin -l app.kubernetes.io/component=mlflow-lib
            exit 1
          }

          # Wait for darwin-mlflow-app (FastAPI app layer)
          echo "Checking darwin-mlflow-app (FastAPI app layer)..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=mlflow-app -n darwin --timeout=300s || {
            echo "ERROR: darwin-mlflow-app pods failed to become ready"
            kubectl get pods -n darwin -l app.kubernetes.io/component=mlflow-app
            kubectl describe pods -n darwin -l app.kubernetes.io/component=mlflow-app
            exit 1
          }

          # Give services additional time to initialize
          echo "Waiting for services to fully initialize..."
          sleep 30

          echo "✅ MLflow services are ready"
          echo ""
          echo "Platform status:"
          kubectl get pods -n darwin
          echo ""
          kubectl get services -n darwin
          echo ""
          kubectl get ingress -n darwin

      - name: Verify MLflow backend health
        run: |
          echo "Testing MLflow backend health endpoint..."

          # Test MLflow backend at /mlflow-lib/health
          for i in {1..30}; do
            if curl -f http://localhost/mlflow-lib/health > /tmp/mlflow-health.log 2>&1; then
              response=$(curl -s http://localhost/mlflow-lib/health)
              echo "MLflow backend response: $response"
              
              if echo "$response" | grep -q "OK"; then
                echo "✅ MLflow backend health check passed!"
                break
              else
                echo "⚠️  Unexpected response from MLflow backend"
                cat /tmp/mlflow-health.log
              fi
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ MLflow backend health check failed after 30 attempts"
              echo "Curl output:"
              cat /tmp/mlflow-health.log || true
              echo ""
              echo "Pod logs:"
              kubectl logs -n darwin -l app=mlflow-lib --tail=100 || true
              exit 1
            fi
            
            echo "Attempt $i/30 - MLflow backend not ready, waiting..."
            sleep 3
          done

      - name: Verify MLflow app layer health
        run: |
          echo "Testing MLflow app layer health endpoint..."

          # Test MLflow app layer at /mlflow-app/health
          for i in {1..30}; do
            if curl -f http://localhost/mlflow-app/healthcheck > /tmp/mlflow-app-health.log 2>&1; then
              response=$(curl -s http://localhost/mlflow-app/healthcheck)
              echo "MLflow app layer response: $response"
              
              if echo "$response" | grep -q '"status":"SUCCESS"' || echo "$response" | grep -q '"status": "SUCCESS"'; then
                echo "✅ MLflow app layer health check passed!"
                break
              else
                echo "⚠️  Unexpected response from MLflow app layer"
                cat /tmp/mlflow-app-health.log
              fi
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ MLflow app layer health check failed after 30 attempts"
              echo "Curl output:"
              cat /tmp/mlflow-app-health.log || true
              echo ""
              echo "Pod logs:"
              kubectl logs -n darwin -l app=mlflow-app --tail=100 || true
              exit 1
            fi
            
            echo "Attempt $i/30 - MLflow app layer not ready, waiting..."
            sleep 3
          done

      - name: Display final platform status
        if: always()
        run: |
          set -o allexport
          . ./config.env
          set +o allexport

          echo "=== Final Platform Status ==="
          echo ""
          echo "Pods:"
          kubectl get pods -n darwin -o wide
          echo ""
          echo "Services:"
          kubectl get services -n darwin
          echo ""
          echo "Ingress:"
          kubectl get ingress -n darwin -o yaml
          echo ""
          echo "Events:"
          kubectl get events -n darwin --sort-by='.lastTimestamp' | tail -20
          echo ""
          echo "=== Pod Descriptions (for troubleshooting) ==="
          kubectl describe pods -n darwin -l app=mysql | tail -50
          echo ""
          kubectl describe pods -n darwin -l app=mlflow-lib | tail -50
          echo ""
          kubectl describe pods -n darwin -l app=mlflow-app | tail -50

      - name: Display service logs on failure
        if: failure()
        run: |
          set -o allexport
          . ./config.env
          set +o allexport

          # Verify KUBECONFIG is set and cluster is accessible
          echo "KUBECONFIG: $KUBECONFIG"
          echo ""
          echo "=== Checking Cluster Access ==="
          kubectl cluster-info || echo "Cannot access cluster"
          echo ""
          echo "=== Available Namespaces ==="
          kubectl get namespaces
          echo ""
          echo "=== All Pods in darwin namespace ==="
          kubectl get pods -n darwin -o wide || echo "Cannot list pods in darwin namespace"
          echo ""

          echo "=== Datastore Health Check Job Logs ==="
          kubectl logs -n darwin -l job-name=darwin-datastore-health-check --tail=200 || echo "No datastore health check logs found"
          echo ""
          echo "=== MySQL logs ==="
          kubectl logs -n darwin -l app=mysql --tail=200 || echo "No MySQL logs found"
          echo ""
          echo "=== MLflow-lib Init Container Logs ==="
          for pod in $(kubectl get pods -n darwin -l app=mlflow-lib -o name); do
            echo "Pod: $pod"
            kubectl logs -n darwin $pod -c wait-for-datastore-health --tail=100 || echo "No init container logs"
          done
          echo ""
          echo "=== MLflow-app Init Container Logs ==="
          for pod in $(kubectl get pods -n darwin -l app=mlflow-app -o name); do
            echo "Pod: $pod"
            kubectl logs -n darwin $pod -c wait-for-datastore-health --tail=100 || echo "No init container logs"
          done
          echo ""
          echo "=== darwin-mlflow (MLflow backend) logs ==="
          kubectl logs -n darwin -l app=mlflow-lib --tail=200 || echo "No darwin-mlflow main container logs found"
          echo ""
          echo "=== darwin-mlflow-app (FastAPI app layer) logs ==="
          kubectl logs -n darwin -l app=mlflow-app --tail=200 || echo "No darwin-mlflow-app main container logs found"
          echo ""
          echo "=== LocalStack logs ==="
          kubectl logs -n darwin -l app=localstack --tail=100 || echo "No LocalStack logs found"

      - name: Cleanup
        if: always()
        run: |
          echo "=== Config.env ==="
          set -o allexport
          . ./config.env
          set +o allexport

          echo ""
          echo "Cleaning up resources..."
          kind delete cluster --name kind || true
          echo "Cleanup complete"
