name: Darwin Catalog - Health Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'darwin-catalog/**'
      - 'init.sh'
      - 'setup.sh'
      - 'start.sh'
      - 'services.yaml'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: [self-hosted, Linux, X64, darwin]
    defaults:
      run:
        working-directory: .
    env:
      KUBECONFIG: ./kind/config/kindkubeconfig.yaml

    steps:
      - name: Runner identity (debug)
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          hostname

      - name: Cleanup previous run artifacts
        run: |
          if command -v kind >/dev/null 2>&1; then
            if kind get clusters 2>/dev/null | grep -q kind; then
              echo "Deleting existing kind cluster..."
              kind delete cluster --name kind || true
            fi
          fi
          
          WORKSPACE_DIR="${{ github.workspace }}"
          if [ -d "$WORKSPACE_DIR" ]; then
            if [ -d "$WORKSPACE_DIR/kind" ]; then
              sudo chmod -R u+w "$WORKSPACE_DIR/kind" 2>/dev/null || true
              sudo rm -rf "$WORKSPACE_DIR/kind/shared-storage" 2>/dev/null || true
              find "$WORKSPACE_DIR/kind" -type d -name "shared-storage" -exec sudo rm -rf {} + 2>/dev/null || true
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up disk space
        run: |
          echo "Current disk usage:"
          df -h
          docker system prune -a -f || true
          docker volume prune -f || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base jq curl wget
          
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          echo "Installing kubectl version: $KUBECTL_VERSION"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          
          if ! file kubectl | grep -q "ELF\|executable"; then
            echo "Downloaded file is not a binary, retrying..."
            rm -f kubectl
            curl -LO "https://storage.googleapis.com/kubernetes-release/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          fi
          
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client
          
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
          
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
          
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote || true

      - name: Initialize configuration (init.sh)
        run: |
          rm -f .setup/enabled-services.yaml
          
          # Prompts: compute, workspace, feature_store, mlflow, serve, catalog(y), chronos, workflow, confirm(y), sdk, ray1, ray2, cli
          printf "n\nn\nn\nn\nn\ny\nn\nn\ny\nn\nn\nn\nn\n" | ./init.sh || {
            echo "init.sh failed"
            if [ -f .setup/enabled-services.yaml ]; then
              cat .setup/enabled-services.yaml
            fi
            exit 1
          }
          
          cat .setup/enabled-services.yaml

      - name: Build images and setup cluster (setup.sh)
        run: |
          docker system prune -f || true
          docker image prune -f || true
          df -h
          
          export ENV=local
          ./setup.sh -y
          
          if [ -f config.env ]; then
            echo "config.env exists"
            cat config.env
          else
            echo "config.env not found"
            exit 1
          fi
          
          docker image prune -f || true
          df -h

      - name: Verify cluster is ready
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi
          
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if kubectl get nodes >/dev/null 2>&1; then
              echo "Cluster is accessible"
              kubectl get nodes
              break
            fi
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for cluster..."
            sleep 5
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Cluster is not accessible"
            exit 1
          fi

      - name: Deploy to Kubernetes (start.sh)
        run: |
          (
            while true; do
              sleep 30
              echo "[$(date +%H:%M:%S)] Deployment in progress..."
              helm list -n darwin 2>/dev/null | head -3 || true
              kubectl get pods -n darwin --no-headers 2>/dev/null | head -5 || true
            done
          ) &
          STATUS_MONITOR_PID=$!
          
          set +e
          ./start.sh 2>&1 | tee /tmp/start.sh.log
          START_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          kill $STATUS_MONITOR_PID 2>/dev/null || true
          
          if [ $START_EXIT_CODE -ne 0 ]; then
            echo "start.sh failed with exit code $START_EXIT_CODE"
            cat /tmp/start.sh.log || true
            helm list -n darwin || true
            helm status darwin -n darwin || true
            kubectl get pods -n darwin || true
            kubectl get pods -n darwin -o json | jq -r '.items[] | select(.status.phase != "Running" and .status.phase != "Succeeded") | "\(.metadata.name): \(.status.phase)"' || true
            kubectl get events -n darwin --sort-by='.lastTimestamp' | tail -20 || true
            for pod in $(kubectl get pods -n darwin -o jsonpath='{.items[?(@.status.phase!="Running" && @.status.phase!="Succeeded")].metadata.name}'); do
              kubectl describe pod -n darwin "$pod" || true
              kubectl logs -n darwin "$pod" --tail=50 || true
            done
            exit 1
          fi
          
          if ! helm list -n darwin | grep -q darwin; then
            echo "Helm release 'darwin' not found"
            exit 1
          fi
          
          echo "Deployment completed"

      - name: Wait for catalog pod to be ready
        run: |
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            POD=$(kubectl get pods -n darwin --no-headers 2>/dev/null | grep -E "darwin-catalog|^catalog-" | head -1 | awk '{print $1}')
            
            if [ -z "$POD" ]; then
              echo "Attempt $((attempt+1))/$max_attempts: catalog pod not found yet..."
              sleep 5
              attempt=$((attempt+1))
              continue
            fi
            
            POD_STATUS=$(kubectl get pod "$POD" -n darwin -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
            READY=$(kubectl get pod "$POD" -n darwin -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            
            if [ "$POD_STATUS" = "Running" ] && [ "$READY" = "true" ]; then
              echo "darwin-catalog pod is ready: $POD"
              kubectl get pod "$POD" -n darwin
              break
            fi
            
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for catalog pod... (Status: $POD_STATUS, Ready: $READY)"
            sleep 5
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "darwin-catalog pod did not become ready"
            kubectl get pods -n darwin | grep -E "darwin-catalog|catalog" || true
            POD=$(kubectl get pods -n darwin --no-headers 2>/dev/null | grep -E "darwin-catalog|^catalog-" | head -1 | awk '{print $1}')
            if [ -n "$POD" ]; then
              kubectl describe pod "$POD" -n darwin || true
              kubectl logs "$POD" -n darwin --tail=50 || true
            fi
            kubectl get pods -n darwin || true
            exit 1
          fi
          
          echo "Catalog pod is ready"
          kubectl get pods -n darwin | grep catalog

      - name: Verify Catalog Health Check via Ingress
        run: |
          kubectl get pods -n darwin | grep catalog
          
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s http://localhost/darwin-catalog/healthcheck > /dev/null 2>&1; then
              echo "Ingress is ready"
              break
            fi
            echo "Attempt $((attempt+1))/$max_attempts: Waiting for ingress..."
            sleep 2
            attempt=$((attempt+1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "Ingress not accessible"
            kubectl get ingress -n darwin || true
            kubectl describe ingress -n darwin || true
            exit 1
          fi
          
          echo "=== Testing darwin-catalog /healthcheck ==="
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" http://localhost/darwin-catalog/healthcheck)
          http_code=$(echo "$response" | grep "HTTP_CODE" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_CODE")
          
          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "Catalog health check returned HTTP $http_code, expected 200"
            exit 1
          fi
          
          if [ "$body" = "OK" ]; then
            echo "Catalog health check passed"
          else
            echo "Unexpected response: '$body', expected 'OK'"
            exit 1
          fi
          
          echo ""
          echo "Catalog health check passed"
          echo "  darwin-catalog: /darwin-catalog/healthcheck -> OK"

      - name: Cleanup
        if: always()
        run: |
          docker system prune -a -f || true
          docker volume prune -f || true
          
          if kind get clusters 2>/dev/null | grep -q kind; then
            kind delete cluster --name kind || true
          fi
          
          docker system prune -f || true
