name: Hermes CLI - Install Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "hermes-cli/**"
      - ".github/workflows/hermes-cli-install.yml"
  workflow_dispatch: # Allow manual triggering

jobs:
  install-and-test:
    name: Installation and CLI Smoke Tests
    runs-on: [self-hosted, Linux, X64, darwin]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hermes-cli

    steps:
      - name: Runner identity (debug)
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          hostname
        working-directory: .

      - name: Cleanup previous run artifacts
        run: |
          echo "🧹 Cleaning up previous run artifacts..."
          # Clean up any leftover directories that might cause permission issues during checkout
          # The checkout action fails if it can't remove directories from previous runs
          WORKSPACE_DIR="${{ github.workspace }}"
          if [ -d "$WORKSPACE_DIR" ]; then
            echo "Cleaning up workspace directory: $WORKSPACE_DIR"
            # Try to remove kind/shared-storage directories that might have permission issues
            # These are often created by Kubernetes volumes and may have restrictive permissions
            if [ -d "$WORKSPACE_DIR/kind" ]; then
              echo "Cleaning up kind directory..."
              sudo chmod -R u+w "$WORKSPACE_DIR/kind" 2>/dev/null || true
              sudo rm -rf "$WORKSPACE_DIR/kind/shared-storage" 2>/dev/null || true
              find "$WORKSPACE_DIR/kind" -type d -name "shared-storage" -exec sudo rm -rf {} + 2>/dev/null || true
            fi
          fi
          echo "✅ Cleanup completed"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install hermes-cli
        run: |
          echo "📦 Installing hermes-cli..."
          python -m pip install --upgrade pip
          python -m pip install -e .
          echo "✅ Installation completed"

      - name: Verify installation
        run: |
          echo "🔍 Verifying hermes-cli installation..."
          # Try --version first, fall back to --help if version not available
          hermes --version 2>/dev/null || hermes --help
          echo "✅ Hermes CLI is installed and accessible"

      - name: Test CLI smoke test
        run: |
          echo "🧪 Testing hermes CLI..."

          # Test that hermes --help works (validates CLI is working)
          echo "  Testing: hermes --help"
          hermes --help

          # Verify it returns exit code 0
          hermes --help > /dev/null

          echo "✅ Hermes CLI is working correctly"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Hermes CLI Install Test Passed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."

          # Clean up Docker to free space (important for GitHub Actions runners)
          echo "Cleaning up Docker resources..."
          docker system prune -a -f || true
          docker volume prune -f || true

          # Kill any port-forwards
          pkill -f "kubectl port-forward" || true

          # Delete kind cluster if it exists
          if command -v kind >/dev/null 2>&1; then
            if kind get clusters 2>/dev/null | grep -q kind; then
              echo "Deleting kind cluster..."
              kind delete cluster --name kind || true
            fi
          fi

          # Final Docker cleanup
          docker system prune -f || true
        working-directory: .
